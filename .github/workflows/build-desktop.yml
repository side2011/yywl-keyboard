name: Build Desktop (Windows / macOS / Linux)

# 三平台桌面版自动打包 + 自动发布
# 触发:
#   1) 推送 v* 标签 (例如 v1.0.0) → 打包, 挂到 GitHub Release, 并上传下载服务器
#   2) 手动触发 (Actions 页面 Run workflow) → 打包 + 上传, 不建 Release
#
# 为什么在 CI 里直接传 FTP:
#   三个包合计约 430 MB, 从国内拉 GitHub 的 Release/Artifact 只有几十 KB/s,
#   而 runner 在海外机房, 上传到服务器是正常带宽, 一步到位。
#
# 需要的仓库 Secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST  FTP_USER  FTP_PASS
#   未配置也不会失败, 会自动跳过上传步骤。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: yywl-keyboard-windows-x64
            # GitHub 的 windows runner 是管理员权限, 不加 signAndEditExecutable=false → exe 会带图标与版本信息
            package_cmd: npx electron-builder --win zip --x64 --publish never
          - name: macOS x64 + arm64
            os: macos-latest
            artifact: yywl-keyboard-macos
            package_cmd: npx electron-builder --mac zip --x64 --arm64 --publish never
          - name: Linux x64
            os: ubuntu-latest
            artifact: yywl-keyboard-linux-x64
            # 三个产物:
            #   AppImage      —— 通用 Linux
            #   dir(x64/arm64) —— 打「国产系统便携版」tar.gz 的原料 (不用 FUSE)
            package_cmd: |
              npx electron-builder --linux AppImage --x64 --publish never &&
              npx electron-builder --linux dir --x64 --publish never --config.directories.output=dist-desktop-x64 &&
              npx electron-builder --linux dir --arm64 --publish never --config.directories.output=dist-desktop-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 缓存 Electron 与 electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 安装依赖
        run: npm ci

      - name: 构建网页产物
        run: npm run build

      - name: 打包桌面版
        run: ${{ matrix.package_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        shell: bash
        run: ls -lh dist-desktop/ || true

      - name: 校验 Windows 产物元数据 (图标/版本是否嵌入)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist-desktop/win-unpacked/*.exe | ForEach-Object {
            "文件: $($_.Name)"
            "  FileVersion : $($_.VersionInfo.FileVersion)"
            "  ProductName : $($_.VersionInfo.ProductName)"
            "  CompanyName : $($_.VersionInfo.CompanyName)"
          }

      # ---- 改名为下载页约定的文件名 ----
      # ---- 国产系统便携版: 不用 AppImage, 避开 FUSE 缺失 / noexec / 沙箱起不来 三个坑 ----
      - name: 打包国产系统便携版
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          node scripts/package-domestic.mjs --dir dist-desktop-x64/linux-unpacked --arch x64
          node scripts/package-domestic.mjs --dir dist-desktop-arm64/linux-arm64-unpacked --arch arm64
          ls -lh release/download/

      # ---- 关键校验: 主进程依赖的模块必须真的打进包, 否则安装后一启动就崩 ----
      - name: 校验主进程模块已打包
        shell: bash
        run: |
          set -e
          ASAR=$(find dist-desktop -name app.asar | head -n 1)
          echo "asar: $ASAR"
          if [ -z "$ASAR" ]; then echo "找不到 app.asar"; exit 1; fi
          for f in desktop-main.cjs desktop-updater.cjs desktop-actions.cjs desktop-preload.cjs; do
            if grep -aq "$f" "$ASAR"; then
              echo "  ✓ $f"
            else
              echo "::error::主进程模块 $f 没有打进 app.asar, 安装后会启动失败"
              exit 1
            fi
          done
      - name: 按约定命名归档
        shell: bash
        run: |
          set -e
          mkdir -p release/download
          VERSION=$(node -p "require('./package.json').version")
          shopt -s nullglob
          case "${{ runner.os }}" in
            Windows)
              for f in dist-desktop/*.zip; do cp "$f" "release/download/yywlkey-config-$VERSION-win-x64.zip"; done ;;
            macOS)
              for f in dist-desktop/*.zip; do
                case "$f" in
                  *arm64*) cp "$f" "release/download/yywlkey-config-$VERSION-mac-arm64.zip" ;;
                  *)       cp "$f" "release/download/yywlkey-config-$VERSION-mac-x64.zip" ;;
                esac
              done ;;
            Linux)
              for f in dist-desktop/*.AppImage; do cp "$f" "release/download/yywlkey-config-$VERSION-linux-x64.AppImage"; done ;;
          esac
          ls -lh release/download/

      # ---- 直接上传到下载服务器 (省掉从国内拉 100+ MB 的过程) ----
      - name: 上传到下载服务器
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::未配置 FTP_HOST / FTP_USER / FTP_PASS, 跳过上传"
            exit 0
          fi
          shopt -s nullglob
          for f in release/download/*; do
            name=$(basename "$f")
            echo "上传 $name ($(du -h "$f" | cut -f1))"
            # --retry-all-errors: 大文件上传偶尔会被服务器断开, 重试比整轮重打好得多
            curl -sS --fail --max-time 3600 --connect-timeout 30 --retry 5 --retry-delay 15 --retry-all-errors --ftp-create-dirs \
              -T "$f" "ftp://$FTP_HOST/download/$name" \
              --user "$FTP_USER:$FTP_PASS"
            echo "  ✓ $name"
          done

      # ---- 校验: 本次构建的网页内容是否与线上一致 (只检查, 不上传) ----
      # update.json 必须描述**线上实际文件**, 所以它由部署流程生成, 不交给 CI 覆盖。
      # 这里只做一致性检查: 若包内嵌的 buildId 与线上不同, 桌面版首次启动会白下一次全量更新。
      - name: 校验构建内容与线上一一致
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          LOCAL=$(node -p "require('./dist/version.json').buildId")
          echo "本次构建 buildId: $LOCAL"
          REMOTE=$(curl -sS --max-time 30 https://key.itytsoft.com/version.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).buildId)}catch(e){console.log('')}})" || echo "")
          echo "线上 buildId:   $REMOTE"
          if [ -n "$REMOTE" ] && [ "$LOCAL" != "$REMOTE" ]; then
            echo "::warning::构建内容与线上不一致 (构建 $LOCAL / 线上 $REMOTE)"
            echo "::warning::包内嵌网页与线上不同, 桌面版首次启动会触发一次全量更新; 建议先部署 dist 再打包。"
          else
            echo "✓ 一致: 桌面版首次启动不会触发无效更新"
          fi

      # 这些包已经传到 FTP 服务器并挂到 Release 上了，artifact 只是给下面
      # 「生成下载清单」任务在同一轮流水线里取文件用，保留 1 天足够。
      # 之前保留 30 天，每轮约 650MB × 6 个包，把 Actions 存储（免费 0.5GB）吃光了。
      - name: 上传 Artifact (仅供清单任务使用, 保留 1 天)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/download/*
          if-no-files-found: error
          retention-days: 1

      - name: 附加到 Release (仅标签触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/download/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ---- 汇总生成下载页清单, 并推到服务器 ----
  manifest:
    name: 生成下载清单
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 收集三个平台的产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 归档到约定目录
        run: |
          mkdir -p release/download
          find artifacts -type f -exec cp {} release/download/ \;
          ls -lh release/download/

      - name: 生成 manifest.json
        run: node scripts/update-manifest.mjs

      - name: 上传清单到服务器
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::未配置 FTP secrets, 跳过清单上传"
            exit 0
          fi
          curl -sS --fail --max-time 120 --ftp-create-dirs \
            -T public/download/manifest.json "ftp://$FTP_HOST/download/manifest.json" \
            --user "$FTP_USER:$FTP_PASS"
          echo "  ✓ manifest.json 已上传"

      - name: 输出发布摘要
        run: |
          node -e "
            const m = require('./public/download/manifest.json');
            console.log('版本:', m.version, '更新日期:', m.updated);
            for (const p of m.packages) {
              console.log('  ' + (p.available ? '✓' : '·'), p.file, p.available ? (p.size/1048576).toFixed(1)+' MB' : '尚未发布');
            }
          "
