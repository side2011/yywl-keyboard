name: Build Desktop (Windows / macOS / Linux)

# 三平台桌面版自动打包 + 自动发布
# 触发:
#   1) 推送 v* 标签 (例如 v1.0.0) → 打包, 挂到 GitHub Release, 并上传下载服务器
#   2) 手动触发 (Actions 页面 Run workflow) → 打包 + 上传, 不建 Release
#
# 为什么在 CI 里直接传 FTP:
#   三个包合计约 430 MB, 从国内拉 GitHub 的 Release/Artifact 只有几十 KB/s,
#   而 runner 在海外机房, 上传到服务器是正常带宽, 一步到位。
#
# 需要的仓库 Secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST  FTP_USER  FTP_PASS
#   未配置也不会失败, 会自动跳过上传步骤。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: yywl-keyboard-windows-x64
            # GitHub 的 windows runner 是管理员权限, 不加 signAndEditExecutable=false → exe 会带图标与版本信息
            package_cmd: npx electron-builder --win zip --x64 --publish never
          - name: macOS x64 + arm64
            os: macos-latest
            artifact: yywl-keyboard-macos
            package_cmd: npx electron-builder --mac zip --x64 --arm64 --publish never
          - name: Linux x64
            os: ubuntu-latest
            artifact: yywl-keyboard-linux-x64
            # 三个产物:
            #   AppImage      —— 通用 Linux
            #   dir(x64/arm64) —— 打「国产系统便携版」tar.gz 的原料 (不用 FUSE)
            package_cmd: |
              npx electron-builder --linux AppImage --x64 --publish never &&
              npx electron-builder --linux dir --x64 --publish never --config.directories.output=dist-desktop-x64 &&
              npx electron-builder --linux dir --arm64 --publish never --config.directories.output=dist-desktop-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 缓存 Electron 与 electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 安装依赖
        run: npm ci

      # 少写一个 import 时 vite build 不会报错, 只有用户点到那页才白屏 —— 这里拦住
      - name: 蓝牙键位解析回归测试
        run: node scripts/test-bt-parse.mjs

      - name: 检查未定义变量
        run: node scripts/check-undef.mjs

      - name: 构建网页产物
        run: npm run build

      - name: 打包桌面版（Windows / Linux）
        if: runner.os != 'macOS'
        run: ${{ matrix.package_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS 单独一步：先出 .app，再做 ad-hoc 签名，最后 ditto 打包。
      # 原因：electron-builder 在 identity='-' 时只把它当成证书名，直接跳过签名；
      # 而 Apple Silicon 的 arm64 可执行文件**必须至少有签名**，否则双击被系统 kill。
      - name: 打包 macOS（ad-hoc 签名）
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          npx electron-builder --mac dir --x64 --arm64 --publish never
          shopt -s nullglob
          for dir in dist-desktop/mac*/; do
            for app in "$dir"*.app; do
              echo "=== ad-hoc 签名: $app ==="
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app" && echo "签名校验通过"

              arch=$(basename "$dir")
              name=$(basename "$app" .app)

              # 打一个"一键解除限制"的脚本一起发出去：
              # 用户下载后双击它, 自动去掉 quarantine 标记并打开程序,
              # 省得他们自己敲 xattr 命令。
              stage="dist-desktop/pkg-$arch"
              rm -rf "$stage"; mkdir -p "$stage"
              cp -R "$app" "$stage/"
              cat > "$stage/首次打开请双击我.command" <<'EOS'
#!/bin/bash
# 双击本文件，会自动解除 macOS 的"无法验证开发者"限制并打开程序。
cd "$(dirname "$0")"
APP=$(ls -d *.app 2>/dev/null | head -1)
if [ -z "$APP" ]; then
  echo "没找到 .app，请确认解压完整（.app 要和本文件在同一个文件夹里）"
  read -n 1 -s -r -p "按任意键关闭..."
  exit 1
fi
echo "正在解除系统限制：$APP"
xattr -dr com.apple.quarantine "$APP" 2>/dev/null
chmod +x "$APP/Contents/MacOS/"* 2>/dev/null
echo "完成，正在打开..."
open "$APP"
echo "如果仍然打不开，请到 系统设置 → 隐私与安全性，拉到最下面点「仍要打开」。"
sleep 2
EOS
              chmod +x "$stage/首次打开请双击我.command"

              out="dist-desktop/${name}-${arch}.zip"
              echo "=== 打包: $out ==="
              ditto -c -k --sequesterRsrc --keepParent "$stage" "$out"
            done
          done
          ls -lh dist-desktop/*.zip

      - name: 列出产物
        shell: bash
        run: ls -lh dist-desktop/ || true

      - name: 校验 Windows 产物元数据 (图标/版本是否嵌入)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist-desktop/win-unpacked/*.exe | ForEach-Object {
            "文件: $($_.Name)"
            "  FileVersion : $($_.VersionInfo.FileVersion)"
            "  ProductName : $($_.VersionInfo.ProductName)"
            "  CompanyName : $($_.VersionInfo.CompanyName)"
          }

      # ---- 改名为下载页约定的文件名 ----
      # ---- 国产系统便携版: 不用 AppImage, 避开 FUSE 缺失 / noexec / 沙箱起不来 三个坑 ----
      - name: 打包国产系统便携版
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          node scripts/package-domestic.mjs --dir dist-desktop-x64/linux-unpacked --arch x64
          node scripts/package-domestic.mjs --dir dist-desktop-arm64/linux-arm64-unpacked --arch arm64
          ls -lh release/download/

      # ---- 关键校验: 主进程依赖的模块必须真的打进包, 否则安装后一启动就崩 ----
      - name: 校验主进程模块已打包
        shell: bash
        run: |
          set -e
          ASAR=$(find dist-desktop -name app.asar | head -n 1)
          echo "asar: $ASAR"
          if [ -z "$ASAR" ]; then echo "找不到 app.asar"; exit 1; fi
          for f in desktop-main.cjs desktop-updater.cjs desktop-actions.cjs desktop-preload.cjs; do
            if grep -aq "$f" "$ASAR"; then
              echo "  ✓ $f"
            else
              echo "::error::主进程模块 $f 没有打进 app.asar, 安装后会启动失败"
              exit 1
            fi
          done
      - name: 按约定命名归档
        shell: bash
        run: |
          set -e
          mkdir -p release/download
          VERSION=$(node -p "require('./package.json').version")
          shopt -s nullglob
          case "${{ runner.os }}" in
            Windows)
              for f in dist-desktop/*.zip; do cp "$f" "release/download/yywlkey-config-$VERSION-win-x64.zip"; done ;;
            macOS)
              for f in dist-desktop/*.zip; do
                case "$f" in
                  *arm64*) cp "$f" "release/download/yywlkey-config-$VERSION-mac-arm64.zip" ;;
                  *)       cp "$f" "release/download/yywlkey-config-$VERSION-mac-x64.zip" ;;
                esac
              done ;;
            Linux)
              for f in dist-desktop/*.AppImage; do cp "$f" "release/download/yywlkey-config-$VERSION-linux-x64.AppImage"; done ;;
          esac
          ls -lh release/download/

      # ---- 直接上传到下载服务器 (省掉从国内拉 100+ MB 的过程) ----
      - name: 上传到下载服务器
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::未配置 FTP_HOST / FTP_USER / FTP_PASS, 跳过上传"
            exit 0
          fi
          shopt -s nullglob
          for f in release/download/*; do
            name=$(basename "$f")
            echo "上传 $name ($(du -h "$f" | cut -f1))"
            # --retry-all-errors: 大文件上传偶尔会被服务器断开, 重试比整轮重打好得多
            curl -sS --fail --max-time 3600 --connect-timeout 30 --retry 5 --retry-delay 15 --retry-all-errors --ftp-create-dirs \
              -T "$f" "ftp://$FTP_HOST/download/$name" \
              --user "$FTP_USER:$FTP_PASS"
            echo "  ✓ $name"
          done

      # ---- 校验: 本次构建的网页内容是否与线上一致 (只检查, 不上传) ----
      # update.json 必须描述**线上实际文件**, 所以它由部署流程生成, 不交给 CI 覆盖。
      # 这里只做一致性检查: 若包内嵌的 buildId 与线上不同, 桌面版首次启动会白下一次全量更新。
      - name: 校验构建内容与线上一一致
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          LOCAL=$(node -p "require('./dist/version.json').buildId")
          echo "本次构建 buildId: $LOCAL"
          REMOTE=$(curl -sS --max-time 30 https://key.itytsoft.com/version.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).buildId)}catch(e){console.log('')}})" || echo "")
          echo "线上 buildId:   $REMOTE"
          if [ -n "$REMOTE" ] && [ "$LOCAL" != "$REMOTE" ]; then
            echo "::warning::构建内容与线上不一致 (构建 $LOCAL / 线上 $REMOTE)"
            echo "::warning::包内嵌网页与线上不同, 桌面版首次启动会触发一次全量更新; 建议先部署 dist 再打包。"
          else
            echo "✓ 一致: 桌面版首次启动不会触发无效更新"
          fi

      # 完全不用 GitHub artifact：大文件曾经把 Actions 免费存储（0.5GB）吃光，
      # 而且超额后连几 KB 都传不上去（配额每 6-12 小时才重算一次）。
      # 这里只把几 KB 的校验信息（体积 + SHA256）传到自己的 FTP，
      # 由下面的「生成下载清单」任务取回。
      - name: 生成产物校验信息
        run: node scripts/make-meta.mjs

      - name: 上传校验信息到服务器 (几 KB)
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::未配置 FTP, 跳过校验信息上传"
            exit 0
          fi
          curl -sS --fail --max-time 120 --connect-timeout 30 --retry 5 --retry-delay 5 --retry-all-errors \
            -T release/download/meta.json "ftp://$FTP_HOST/download/meta-${{ matrix.artifact }}.json" \
            --user "$FTP_USER:$FTP_PASS"
          echo "  ✓ meta-${{ matrix.artifact }}.json"

      - name: 附加到 Release (仅标签触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/download/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ---- 汇总生成下载页清单, 并推到服务器 ----
  manifest:
    name: 生成下载清单
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 从服务器取回各平台的校验信息
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          mkdir -p meta
          for a in yywl-keyboard-windows-x64 yywl-keyboard-macos yywl-keyboard-linux-x64; do
            echo "取回 meta-$a.json"
            curl -sS --fail --max-time 120 --connect-timeout 30 --retry 5 --retry-delay 5 --retry-all-errors \
              "ftp://$FTP_HOST/download/meta-$a.json" --user "$FTP_USER:$FTP_PASS" \
              -o "meta/meta-$a.json" || echo "::warning::meta-$a.json 取回失败（该平台可能没有产物）"
          done
          ls -l meta || true

      - name: 生成 manifest.json
        run: node scripts/update-manifest.mjs --meta=meta

      - name: 上传清单到服务器
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::未配置 FTP secrets, 跳过清单上传"
            exit 0
          fi
          curl -sS --fail --max-time 120 --ftp-create-dirs \
            -T public/download/manifest.json "ftp://$FTP_HOST/download/manifest.json" \
            --user "$FTP_USER:$FTP_PASS"
          echo "  ✓ manifest.json 已上传"

      - name: 输出发布摘要
        run: |
          node -e "
            const m = require('./public/download/manifest.json');
            console.log('版本:', m.version, '更新日期:', m.updated);
            for (const p of m.packages) {
              console.log('  ' + (p.available ? '✓' : '·'), p.file, p.available ? (p.size/1048576).toFixed(1)+' MB' : '尚未发布');
            }
          "
