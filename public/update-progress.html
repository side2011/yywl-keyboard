<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>正在更新</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f8fafc; color: #1e293b; height: 100vh; display: flex;
    align-items: center; justify-content: center; user-select: none;
  }
  .box { width: 100%; padding: 22px 22px 16px; }
  .title { font-size: 16px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4f46e5; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }
  .sub { font-size: 12.5px; color: #64748b; line-height: 1.8; margin-bottom: 14px; }
  .bar { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #4f46e5, #7c3aed); transition: width .25s ease; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #475569; margin-top: 8px; font-variant-numeric: tabular-nums; }`n  .meta span { white-space: nowrap; }`n  body { overflow: hidden; }
  .foot { display: flex; justify-content: flex-end; margin-top: 14px; }
  button {
    padding: 6px 14px; font-size: 12.5px; font-weight: 600; color: #475569;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer;
  }
  button:hover { border-color: #a5b4fc; color: #4338ca; }
  button:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>
<div class="box">
  <div class="title"><span class="dot"></span><span id="title">正在下载新版本</span></div>
  <div class="sub" id="sub">下载期间请不要关闭程序，完成后会自动启动新版本。</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="meta"><span id="percent">0%</span><span id="size">—</span></div>
  <div class="foot"><button id="cancel">取消更新</button></div>
</div>
<script>
  var fill = document.getElementById('fill');
  var percent = document.getElementById('percent');
  var size = document.getElementById('size');
  var title = document.getElementById('title');
  var sub = document.getElementById('sub');
  var cancel = document.getElementById('cancel');

  window.updSet = function (data) {
    if (!data) return;
    if (typeof data.percent === 'number') {
      var p = Math.max(0, Math.min(100, data.percent));
      fill.style.width = p + '%';
      percent.textContent = p.toFixed(0) + '%';
    }
    if (data.text) sub.textContent = data.text;
    if (data.title) title.textContent = data.title;
    if (data.size) size.textContent = data.size;
    if (data.done) {
      cancel.disabled = true;
      fill.style.width = '100%';
      percent.textContent = '100%';
    }
  };

  cancel.addEventListener('click', function () {
    if (cancel.disabled) return;
    cancel.disabled = true;
    sub.textContent = '正在取消…';
    if (window.updCancel) window.updCancel();
  });
</script>
</body>
</html>
